*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:640px;overflow:hidden}

.brand{display:flex;align-items:center;gap:16px;margin-bottom:28px}

p{font-size:22px;color:#a6a6a6;line-height:1.4;max-width:600px;text-wrap:pretty;margin-bottom:30px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pills span{font:500 14px "Geist Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#cfcfcf;border:1px solid #333;border-radius:999px;padding:8px 14px}
.grid{display:grid;grid-template-columns:repeat(3,150px);gap:22px;transform:rotate(-6deg)}
.tile{width:150px;height:150px;border-radius:34px;display:grid;place-items:center;box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.tile svg{width:84px;height:84px}
